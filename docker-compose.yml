# Consulting Desk — self-contained project folder
#
#   cd 004_NLP_TDA_CONSULTING
#   ./scripts/up.sh
#   open http://127.0.0.1:38417/
#
# Build context is THIS folder. Runtime data stays in ./data.

name: consulting-desk

services:
  nlp-tda:
    build:
      context: .
      dockerfile: Dockerfile
    image: nlp-tda:local
    container_name: nlp-tda
    ports:
      - "${NLP_TDA_PORT:-38417}:38417"
    env_file:
      - path: .env
        required: false
    environment:
      NLP_TDA_HOST: "0.0.0.0"
      NLP_TDA_PORT: "38417"
      NLP_TDA_PROJECT_ROOT: "/app"
      NLP_TDA_DATA_DIR: "/app/data"
      NLP_TDA_SQLITE_PATH: "/app/data/master.db"
      NLP_TDA_CHROMA_PATH: "/app/data/chroma"
      NLP_TDA_UPLOADS_DIR: "/app/data/uploads"
      NLP_TDA_EXPORTS_DIR: "/app/data/exports"
      NLP_TDA_FIXTURES_DIR: "/app/fixtures/synthetic_engagement"
      NLP_TDA_USE_HASH_EMBEDDINGS: "${NLP_TDA_USE_HASH_EMBEDDINGS:-true}"
      NLP_TDA_FORCE_MOCK_LLM: "${NLP_TDA_FORCE_MOCK_LLM:-false}"
      # The ollama service below; point it at a host Ollama with e.g. http://host.docker.internal:11434
      NLP_TDA_OLLAMA_BASE_URL: "${NLP_TDA_OLLAMA_BASE_URL:-http://ollama:11434}"
      NLP_TDA_OLLAMA_MODEL: "${NLP_TDA_OLLAMA_MODEL:-qwen2.5:7b}"
      PYTHONPATH: "/app/src"
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - hf-cache:/root/.cache/huggingface   # embedding model weights survive container recreation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38417/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  # Local LLM for extraction and answers. CPU only inside Docker on macOS (no GPU access).
  # Pull the model once:  docker compose exec ollama ollama pull qwen2.5:14b
  ollama:
    image: ollama/ollama
    container_name: nlp-tda-ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  hf-cache:
  ollama-models:
